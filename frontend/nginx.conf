server {
  listen 80;
  server_tokens off;
  # CSV da SIL ~200 MB. 210m deixa folga para o envelope do multipart; o backend recusa o arquivo acima de 200 MB.
  client_max_body_size 210m;
  root /usr/share/nginx/html;
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy no-referrer always;

  location = /healthz { access_log off; return 200 "ok\n"; }
  # Upload longo: o corpo vai em streaming e a carga responde 202; o proxy não pode cortar no meio do envio.
  location = /api/cargas/sil/imoveis {
    client_max_body_size 210m;
    client_body_timeout 1800s;
    send_timeout 1800s;
    proxy_pass http://backend:8000;
    proxy_http_version 1.1;
    proxy_request_buffering off;
    proxy_read_timeout 1800s;
    proxy_send_timeout 1800s;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
  location /api/ {
    client_max_body_size 210m;
    proxy_pass http://backend:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
  # index.html nunca em cache (senão o navegador segue com o build antigo depois do deploy); assets têm hash no nome.
  location /assets/ { add_header Cache-Control "public, max-age=31536000, immutable"; add_header X-Content-Type-Options nosniff always; add_header X-Frame-Options DENY always; add_header Referrer-Policy no-referrer always; try_files $uri =404; }
  location / { add_header Cache-Control "no-cache" always; add_header X-Content-Type-Options nosniff always; add_header X-Frame-Options DENY always; add_header Referrer-Policy no-referrer always; try_files $uri /index.html; }
}
